name: Firmware CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.14

    strategy:
      fail-fast: false
      matrix:
        board:
          - nrf52840dk/nrf52840

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: app

    - name: West init and update
      working-directory: app
      run: |
        west init -l firmware
        west update --narrow -o=--depth=1
        west zephyr-export

    - name: Build
      working-directory: app/firmware
      run: |
        west build -b ${{ matrix.board }} --pristine

    - name: Binary size report
      working-directory: app/firmware
      run: |
        echo "=== Memory Usage ==="
        size build/zephyr/zephyr.elf

    - name: Flash limit check
      working-directory: app/firmware
      run: |
        FLASH_USED=$(size build/zephyr/zephyr.elf | awk 'NR==2{print $1+$2}')
        FLASH_LIMIT=450000
        echo "Flash used: $FLASH_USED / $FLASH_LIMIT bytes"
        if [ "$FLASH_USED" -gt "$FLASH_LIMIT" ]; then
          echo "ERROR: Flash limit exceeded!"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.board }}-${{ github.sha }}
        path: |
          app/firmware/build/zephyr/zephyr.elf
          app/firmware/build/zephyr/zephyr.hex
        retention-days: 30
EOFcat > ~/projects/BLE-zephyr-hearable-system/.github/workflows/build.yml << 'EOF'
