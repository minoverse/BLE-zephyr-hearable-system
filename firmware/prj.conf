# Power Management
# HAS_PM is selected by APP_PM_HOOKS in the app Kconfig file —
# that is what makes CONFIG_PM=y actually take effect on nRF52840.
CONFIG_PM=y
# CONFIG_PM_DEVICE is intentionally disabled.
# pm_resume_devices() is called from ISR context (_isr_wrapper → pm_system_resume).
# Any PM device whose resume callback does I/O (I2C, SPI, QSPI, sensor init)
# calls k_sem_take() from ISR context → assertion in sem.c.
# CPU sleep (WFI / suspend-to-idle) works through CONFIG_PM alone;
# device PM hooks are not needed for this application.
CONFIG_PM_DEVICE=n
CONFIG_TICKLESS_KERNEL=y

# Sleep / idle stats (SCHED_THREAD_USAGE* are auto-selected by THREAD_RUNTIME_STATS)
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y
CONFIG_TIMING_FUNCTIONS=y

# Logging - FIXED
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# CONFIG_LOG_BACKEND_UART is not set
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_LOG_BACKEND_RTT_OUTPUT_BUFFER_SIZE=512

# Float support
CONFIG_CBPRINTF_FP_SUPPORT=y

# Fault dump
CONFIG_FAULT_DUMP=2
CONFIG_RTT_CONSOLE=y

# Image version for MCUboot header (must match CMakeLists.txt version)
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0+0"

# Misc
CONFIG_WATCHDOG=n
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y

# --- Diagnostic Settings ---
CONFIG_BOOT_BANNER=y
CONFIG_LSM6DSO_TRIGGER_NONE=y

