name: Firmware CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - nrf52840dk/nrf52840

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: ble-hearable
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Setup Zephyr project
      uses: zephyrproject-rtos/action-zephyr-setup@v1
      with:
        app-path: ble-hearable
        toolchains: arm-zephyr-eabi

    - name: Build firmware
      working-directory: ble-hearable/firmware
      run: |
        west build -b ${{ matrix.board }} --pristine

    - name: Binary size report
      working-directory: ble-hearable/firmware
      run: |
        echo "=== Memory Usage ==="
        size build/zephyr/zephyr.elf

    - name: Flash limit check
      working-directory: ble-hearable/firmware
      run: |
        FLASH_USED=$(size build/zephyr/zephyr.elf | awk 'NR==2{print $1+$2}')
        FLASH_LIMIT=450000
        echo "Flash used: $FLASH_USED / $FLASH_LIMIT bytes"
        if [ "$FLASH_USED" -gt "$FLASH_LIMIT" ]; then
          echo "ERROR: Flash limit exceeded!"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-nrf52840dk-${{ github.sha }}
        path: |
          ble-hearable/firmware/build/zephyr/zephyr.elf
          ble-hearable/firmware/build/zephyr/zephyr.hex
        retention-days: 30
